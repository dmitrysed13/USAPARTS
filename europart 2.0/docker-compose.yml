# Local data services for EUROPART 2.0.
# The Next.js app runs on the host via `npm run dev`.
# Passwords below are for this local compose file only.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: europart
      POSTGRES_PASSWORD: europart
      POSTGRES_DB: europart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U europart -d europart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
